services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POWERSYNC_PG_PASSWORD: ${POWERSYNC_PG_PASSWORD}
      POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5433:5432"
    volumes:
      - ../../shared/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-powersync.sh:/docker-entrypoint-initdb.d/02-init-powersync.sh:ro

  powersync:
    image: journeyapps/powersync-service:1.27.2
    depends_on:
      - postgres
    environment:
      PS_POWERSYNC_PG_URI: postgresql://powersync_role:${POWERSYNC_PG_PASSWORD}@postgres:5432/testdb
      PS_POWERSYNC_STORAGE_URI: postgresql://powersync_storage_user:${POWERSYNC_STORAGE_PASSWORD}@postgres:5432/powersync_storage
      PS_POWERSYNC_JWT_SECRET: ${POWERSYNC_JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./service.yaml:/config/service.yaml:ro
      - ./sync-config.yaml:/config/sync-config.yaml:ro
    command: ["start", "--config-path", "/config/service.yaml"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    depends_on:
      - powersync
    ports:
      - "8081:8081"
      - "8474:8474"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
